# Codex CLI Project Configuration
# This file enables project-specific Codex settings

# Default model configuration
# Top-level Codex acts as planner: sol at high effort (see AGENTS.md §8).
# Implementation/review sub-invocations downshift via -c model_reasoning_effort=...
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "detailed"

# Web search
web_search = "live"

# Approval policy
approval_policy = "never"

# Feature toggles
[features]
skills = true

# Skills configuration - enable project skills
[[skills.config]]
enabled = true
path = ".codex/skills/context-loader"

[[skills.config]]
enabled = true
path = ".codex/skills/design-tracker"

# Response style
verbosity = "medium"
